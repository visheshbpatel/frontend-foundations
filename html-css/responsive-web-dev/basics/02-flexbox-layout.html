<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flexbox Basics</title>
    <link rel="stylesheet" href="02-flexbox-layout.css">
</head>
<body>

    <h1>Flexbox Practice</h1>

    <!-- Basic Row -->
    <section>
        <h2>1. display: flex (default row)</h2>
        <div class="container row">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>
    </section>

    <!-- Column Direction -->
    <section>
        <h2>2. flex-direction: column</h2>
        <div class="container column">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>
    </section>

    <!-- Justify Content -->
    <section>
        <h2>3. justify-content: center</h2>
        <div class="container justify-center">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>
    </section>

    <!-- Align Items -->
    <section>
        <h2>4. align-items: center</h2>
        <div class="container align-center">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>
    </section>

    <!-- Wrap -->
    <section>
        <h2>5. flex-wrap: wrap</h2>
        <div class="container wrap">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>
            <div class="box">5</div>
            <div class="box">6</div>
        </div>
    </section>

    <!-- Flex Grow -->
    <section>
        <h2>6. flex-grow</h2>
        <div class="container grow">
            <div class="box grow1">1</div>
            <div class="box grow2">2</div>
            <div class="box">3</div>
        </div>
    </section>

</body>
</html>
