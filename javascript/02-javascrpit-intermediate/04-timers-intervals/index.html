<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Centered Progress</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="wrapper">
      <div class="progress-card">

        <h5>Your download will start in <span id="countdown">5</span> secs...</h5>

        <h3>Downloding...</h3>

        <div class="progress-bar">
          <div class="progress" id="progressFill"></div>
        </div>

        <p id="progressText">0%</p>

      </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
